[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-repo-python"
version = "1.0.0"
description = "TigerGate Code Security Clean Python Component"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.29",
    "cryptography>=42.0.5",
]
