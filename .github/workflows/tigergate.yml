name: TigerGate Security Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    env:
      TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TigerGate Security Scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            -e TIGERGATE_API_KEY \
            -e GITHUB_TOKEN \
            tigergate/tigergate-cli:latest \
            scan \
            --api-url https://api.staging.tigergate.dev/api/ci \
            --type all \
            --scan-scope auto \
            --fail-on critical,high \
            --max-critical 0 \
            --max-high 10 \
            --quality-gate \
            --exclude "node_modules,dist,vendor" \
            --sca-ignore-unfixed \
            --compliance \
            --upload
